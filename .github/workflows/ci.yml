name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Vet + build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -trimpath -o /tmp/ee-tunnel .
      - run: /tmp/ee-tunnel version

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m
